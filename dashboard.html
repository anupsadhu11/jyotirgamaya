<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jyotirgamaya Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell dashboard-shell">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Welcome back</p>
          <h1>Your Astrology Dashboard</h1>
        </div>
        <a class="btn btn-primary" href="index.html">New Reading</a>
      </header>

      <section class="dashboard-grid">
        <article class="card">
          <h3>Recent Readings</h3>
          <ul class="dashboard-list" id="recent-readings-list">
            <li>Loading...</li>
          </ul>
        </article>

        <article class="card">
          <h3>Upcoming Muhurat</h3>
          <p>Best time for spiritual practice: 7:30 AM - 9:00 AM</p>
        </article>

        <article class="card">
          <h3>Saved Insights</h3>
          <p id="saved-insights">Save a reading to see your latest chart highlights here.</p>
        </article>
      </section>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
